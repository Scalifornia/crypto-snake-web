<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Crypto Snake Web</title>
  <link rel="stylesheet" href="style.css?v=158" />
</head>

<body>
  <div id="app">

    <header class="topbar">
      <div class="brand">Crypto Snake</div>

      <div class="stats" id="stats">
        <div class="pill">Coins: <span id="score">0</span></div>
        <div class="pill">$ Value: <span id="best">$0</span></div>
        <div class="pill">Style: <span id="level">Neon Blue</span></div>
        <div class="pill">Time: <span id="time">--</span></div>
        <div class="pill">Power: <span id="combo">--</span></div>
      </div>

      <div class="actions">
        <button id="btnHint" class="btn btn-hint" type="button">Hint ON</button>
        <button id="btnMenu" class="btn">Menu</button>
      </div>
    </header>

    
    <div id="menu" class="panel menu-home">
      <img class="menu-bg-image" src="assets/menu/fundo_snake_melhorado.png" alt="" />
      <div class="menu-backdrop"></div>

      <div class="menu-home-inner">
        <div class="menu-hero">
          <h1>CRYPTO SNAKE</h1>
          <p>Three focused arcade modes with distinct neon identities.</p>
        </div>

        <div class="menu-home-actions">
          <button id="btnPlay" class="btn btn-primary btn-home">Play</button>
          <button id="btnOptions" class="btn btn-home">Options</button>
        </div>
      </div>

      <div id="optionsPanel" class="options-panel hidden">
        <div class="menu-shell">
          <div class="menu-card options-card">
            <div class="options-header">
              <h2>Options</h2>
              <button id="btnCloseOptions" class="btn">Close</button>
            </div>

            <details class="submenu" open>
              <summary>Game</summary>

              <div class="row hidden">
                <label for="boardSize">Mundo</label>
                <select id="boardSize">
                  <option value="small">Mundo 1</option>
                  <option value="medium" selected>Mundo 2</option>
                  <option value="large">Mundo 3</option>
                </select>
              </div>

              <div class="row">
                <label for="mode">Modo</label>
                <select id="mode">
                  <option value="classic" selected>Classic — Neon Amber</option>
                  <option value="timed">Time Attack — Neon Blue</option>
                  <option value="survival">Survival — Neon Violet</option>
                </select>
              </div>

              <div id="timedOptionsGroup" class="submenu nested-submenu hidden">
                <div class="nested-submenu-title">Time Attack</div>
                <div class="row">
                  <label for="timedDuration">Tempo inicial</label>
                  <select id="timedDuration">
                    <option value="20" selected>Auto por modo</option>
                    <option value="10">10 segundos</option>
                    <option value="20">20 segundos</option>
                    <option value="30">30 segundos</option>
                  </select>
                </div>
              </div>

              <div class="row">
                <label for="difficulty">Dificuldade</label>
                <select id="difficulty">
                  <option value="easy">Easy</option>
                  <option value="normal" selected>Normal</option>
                  <option value="hard">Hard</option>
                </select>
              </div>

              <div class="row">
                <label for="walls">Paredes</label>
                <select id="walls">
                  <option value="off" selected>OFF (wrap)</option>
                  <option value="on">ON (colisão)</option>
                </select>
              </div>

              <div class="row">
                <label for="hint">Tutorial</label>
                <select id="hint">
                  <option value="on" selected>ON</option>
                  <option value="off">OFF</option>
                </select>
              </div>

              <div class="row">
                <label for="alignmentHint">Hint alinhado</label>
                <select id="alignmentHint">
                  <option value="on" selected>ON</option>
                  <option value="off">OFF</option>
                </select>
              </div>

              <div class="row">
                <label for="grid">Grelha</label>
                <select id="grid">
                  <option value="off" selected>OFF</option>
                  <option value="mid">Médio</option>
                  <option value="low">Fraco</option>
                </select>
              </div>
            </details>

            <details class="submenu">
              <summary>Audio</summary>

              <div class="row">
                <label for="music">Música</label>
                <select id="music">
                  <option value="on" selected>On</option>
                  <option value="off">Off</option>
                </select>
              </div>

              <div class="row">
                <label for="musicVol">Volume música</label>
                <input id="musicVol" type="range" min="0" max="100" value="60" />
              </div>

              <div class="row">
                <label for="sound">Efeitos</label>
                <select id="sound">
                  <option value="on" selected>On</option>
                  <option value="off">Off</option>
                </select>
              </div>

              <div class="row">
                <label for="sfxVol">Volume efeitos</label>
                <input id="sfxVol" type="range" min="0" max="100" value="80" />
              </div>

              <div class="row">
                <label for="musicSource">Fonte</label>
                <select id="musicSource">
                  <option value="default" selected>Trilha Sonora</option>
                  <option value="upload">Ficheiro local</option>
                </select>
              </div>

              <div class="row">
                <label for="musicFile">Carregar música</label>
                <input id="musicFile" type="file" accept="audio/*" />
              </div>
            </details>

            <details class="submenu">
              <summary>Image</summary>

              <div class="row">
                <label for="bgPreset">Biblioteca</label>
                <select id="bgPreset">
                  <option value="none" selected>Sem preset</option>
                  <option value="alien1">Alien 1</option>
                  <option value="allien2">Alien 2</option>
                  <option value="bitimage">Bit Image</option>
                  <option value="bitimage1">Bit Image 1</option>
                  <option value="image">Image</option>
                  <option value="image1">Image 1</option>
                  <option value="image2">Image 2</option>
                  <option value="image3">Image 3</option>
                  <option value="images">Images</option>
                </select>
              </div>

              <div class="row">
                <label for="bgOpacity">Opacidade fundo</label>
                <input id="bgOpacity" type="range" min="0" max="100" value="40" />
              </div>

              <div class="row">
                <label for="bgFile">Fundo (upload)</label>
                <input id="bgFile" type="file" accept="image/*" />
              </div>
            </details>
          </div>
        </div>
      </div>
    </div>

    <main class="stage">
      <canvas id="game" width="900" height="700" aria-label="Crypto Snake"></canvas>
      <div id="tutorialCard" class="tutorial-card hidden" role="status" aria-live="polite">
        <div id="tutorialText" class="tutorial-text"></div>
        <div id="tutorialKeys" class="tutorial-keys hidden" aria-hidden="true">
          <span>W</span>
          <span>A</span>
          <span>S</span>
          <span>D</span>
          <span>↑</span>
          <span>←</span>
          <span>↓</span>
          <span>→</span>
        </div>
      </div>
    </main>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-card gameover-card">
        <h2 id="overlayTitle">Pausa</h2>
        <p id="overlayText">Espaço para continuar</p>

        <div id="rankingNameWrap" class="ranking-name-wrap hidden">
          <label for="rankingNameInput">Novo Top 3 — nome</label>
          <div class="ranking-name-row">
            <input id="rankingNameInput" type="text" maxlength="12" placeholder="PLAYER" />
            <button id="btnSaveRank" class="btn btn-primary">Save</button>
          </div>
        </div>

        <div id="overlayRanking" class="overlay-ranking hidden">
          <div class="overlay-ranking-title">Ranking</div>
          <div id="rankingList" class="ranking-list"></div>
        </div>

        <div class="buttons overlay-actions">
          <button id="btnOverlayReset" class="btn">Try Again</button>
          <button id="btnOverlayWorlds" class="btn">Modes</button>
          <button id="btnOverlayMenu" class="btn">Menu</button>
        </div>
      </div>
    </div>

    <div id="worldToast" class="world-toast hidden"></div>
  </div>

  <script defer src="app.js?v=170"></script>
</body>
</html>
